# Build with Cloud Build free tier (2500 build-minutes/month), push to
# Artifact Registry (0.5 GB free), then deploy to Cloud Run (2M requests/month free).
#
# Usage:
#   gcloud builds submit --config=cloudbuild.yaml \
#     --substitutions=_NEXT_PUBLIC_FIREBASE_API_KEY=...,_NEXT_PUBLIC_FIREBASE_PROJECT_ID=...
#
# Cloud Run gets the runtime-only vars (ADMIN_EMAILS) set in the final step —
# either edit them below or use the --set-env-vars flag on a manual deploy.

steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/badminton-club:${_COMMIT_SHA}"
      - "--build-arg"
      - "NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY}"
      - "--build-arg"
      - "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}"
      - "--build-arg"
      - "NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID}"
      - "--build-arg"
      - "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}"
      - "--build-arg"
      - "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}"
      - "--build-arg"
      - "NEXT_PUBLIC_FIREBASE_APP_ID=${_NEXT_PUBLIC_FIREBASE_APP_ID}"
      - "--build-arg"
      - "NEXT_PUBLIC_CURRENCY=${_NEXT_PUBLIC_CURRENCY}"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/badminton-club:${_COMMIT_SHA}"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "badminton-club"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/badminton-club:${_COMMIT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=2"
      - "--cpu-throttling"
      - "--set-env-vars=ADMIN_EMAILS=${_ADMIN_EMAILS}"

substitutions:
  _REGION: us-east1
  _REPO: badminton-club
  _COMMIT_SHA: ${BUILD_ID}
  _ADMIN_EMAILS: "you@example.com"
  # The NEXT_PUBLIC_FIREBASE_* values have no defaults — always pass them on
  # the command line so the web config is never hard-coded in the repo.
  _NEXT_PUBLIC_FIREBASE_API_KEY: ""
  _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ""
  _NEXT_PUBLIC_FIREBASE_PROJECT_ID: ""
  _NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ""
  _NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ""
  _NEXT_PUBLIC_FIREBASE_APP_ID: ""
  _NEXT_PUBLIC_CURRENCY: DKK

options:
  logging: CLOUD_LOGGING_ONLY
